# ============================================================
# Google App Engine — Static SPA Deployment (Vite/React)
# ============================================================
#
# PREREQUISITES (run once per new GCP project):
#   1. gcloud auth login
#   2. gcloud config set project <PROJECT_ID>
#   3. gcloud app create --region=<REGION>
#      (europe-west1 = Belgium, us-central = Iowa, etc.)
#      WARNING: region is PERMANENT — cannot be changed after creation
#   4. gcloud services enable cloudbuild.googleapis.com --project=<PROJECT_ID>
#   5. gsutil iam ch serviceAccount:<PROJECT_ID>@appspot.gserviceaccount.com:admin \
#        gs://staging.<PROJECT_ID>.appspot.com
#      (the staging bucket is auto-created by step 3, step 5 grants deploy access)
#
# BUILD & DEPLOY:
#   npm run build && gcloud app deploy app.yaml --project=<PROJECT_ID>
#
# SUBSEQUENT DEPLOYS (skip confirmation prompt):
#   npm run build && gcloud app deploy app.yaml --project=<PROJECT_ID> --quiet
#
# VIEW LIVE SITE:
#   gcloud app browse --project=<PROJECT_ID>
#   URL pattern: https://<PROJECT_ID>.<REGION_CODE>.r.appspot.com
#
# NOTES:
#   - This config serves a PRE-BUILT static site from dist/
#   - No server process runs — App Engine only serves static files
#   - .gcloudignore must NOT ignore dist/ (that's what gets served)
#   - .gcloudignore SHOULD ignore node_modules/, src/, etc.
#   - min_instances: 0 = scale to zero = free when idle
#   - F1 instance class is free-tier eligible (28 hrs/day)
# ============================================================

runtime: nodejs20
instance_class: F1

env_variables:
  NODE_ENV: "production"

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0       # Scale to zero when idle (free tier friendly)
  max_instances: 2       # Cap costs — increase if needed for traffic spikes

handlers:
  # Vite hashed assets (JS/CSS in dist/assets/) — cache forever
  # Vite adds content hashes to filenames, so new deploys get new URLs automatically
  - url: /assets/(.*)
    static_files: dist/assets/\1
    upload: dist/assets/(.*)
    secure: always
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"

  # Other static files at dist root (favicon, images, manifest, fonts, videos)
  - url: /(.*\.(ico|png|jpg|jpeg|gif|svg|webp|webmanifest|txt|json|map|woff|woff2|ttf|eot|mp4|mov|webm))$
    static_files: dist/\1
    upload: dist/(.*\.(ico|png|jpg|jpeg|gif|svg|webp|webmanifest|txt|json|map|woff|woff2|ttf|eot|mp4|mov|webm))$
    secure: always
    http_headers:
      Cache-Control: "public, max-age=86400"

  # SPA fallback — all unmatched routes serve index.html
  # This is what makes client-side routing (react-router) work
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    http_headers:
      Cache-Control: "no-cache, no-store, must-revalidate"
