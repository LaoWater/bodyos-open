# Run scripts/deploy-web.sh from a clean checkout; review the preview before promotion.
substitutions:
  _VERSION: community-preview
steps:
  - name: node:22
    dir: apps/web
    entrypoint: npm
    args: ['ci']
  - name: node:22
    dir: apps/web
    entrypoint: npm
    args: ['run', 'build']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    dir: apps/web
    entrypoint: gcloud
    args: ['app', 'deploy', 'app.yaml', '--project=$PROJECT_ID', '--version=${_VERSION}', '--no-promote', '--no-stop-previous-version', '--quiet']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
